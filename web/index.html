<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>uhd-pure WebUSB probe</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
      fieldset { margin: 1rem 0; padding: 1rem; }
      button, input { font: inherit; margin: .25rem; }
      output { display: block; white-space: pre-wrap; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>uhd-pure WebUSB probe</h1>
    <p>Connect a B2xx, then choose it in the browser prompt.</p>
    <button id="connect">Connect B2xx</button>

    <fieldset disabled id="device-controls">
      <legend>Device</legend>
      <button id="probe">Probe FX3 and EEPROM</button>
      <label>FPGA image <input id="fpga" type="file" accept=".bin"></label>
      <button id="load-fpga">Load FPGA</button>
      <button id="open-transport">Open FPGA transport</button>
    </fieldset>

    <fieldset disabled id="register-controls">
      <legend>Wishbone register</legend>
      <label>Address <input id="address" value="0x0"></label>
      <button id="peek">Peek32</button>
    </fieldset>

    <output id="log">Loading WebAssembly…</output>
    <script type="module" src="./main.js"></script>
  </body>
</html>
