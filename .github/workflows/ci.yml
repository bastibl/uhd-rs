name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo test --locked --package uhd-rs --release --lib images::tests
      - run: cargo package --locked --package uhd-rs

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, no-default, smol, tokio, all]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test without hardware
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          args=()
          case "$FEATURES" in
            no-default) args+=(--no-default-features) ;;
            smol|tokio) args+=(--features "$FEATURES") ;;
            all) args+=(--all-features) ;;
          esac
          cargo test --locked --all-targets "${args[@]}"
          cargo test --locked --doc "${args[@]}"

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features

  wasm:
    name: WebUSB compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --all-targets --target wasm32-unknown-unknown
      - run: cargo check --locked --all-targets --target wasm32-unknown-unknown --all-features
      - run: cargo check --locked --all-targets --target wasm32-unknown-unknown --no-default-features

  webusb:
    name: Browser lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: true
      - name: Install matching wasm-bindgen test runner
        shell: python
        run: |
          import json, subprocess
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--format-version", "1"]))
          version = next(p["version"] for p in metadata["packages"]
                         if p["name"] == "wasm-bindgen")
          subprocess.run(["cargo", "install", "wasm-bindgen-cli",
                          "--version", version, "--locked"], check=True)
      - name: Configure Chrome
        shell: python
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          import json, os
          with open("webdriver.json", "w") as output:
              json.dump({"goog:chromeOptions": {"binary": os.environ["CHROME_BINARY"]}}, output)
      - name: Exercise WebUSB lifecycle without hardware
        env:
          WASM_BINDGEN_USE_BROWSER: "1"
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo test --locked --target wasm32-unknown-unknown --lib --test browser_worker --all-features
